<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kereshop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F5B301'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23172033'%3EK%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FAFAF9; --panel: #FFFFFF;
    --line: #EAE8E3; --line-soft: #F1F0EC;
    --text: #172033; --muted: #6B7280; --faint: #9AA1AC;
    --brand: #F5B301; --brand-hover: #E2A500; --brand-soft: #FEF6DC;
    --ink: #8A6100;
    --ok: #1E7F4F; --ok-bg: #EDF7F0;
    --bad: #C0392B; --bad-bg: #FBEFEE;
    --nav-w: 60px; --nav-w-open: 224px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; max-width: 100%; box-sizing: border-box; }
  body {
    font-family: "DM Sans", -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--ink); text-decoration: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #DDDAD3; border-radius: 6px; border: 2px solid var(--bg); }

  .shell { display: flex; height: 100vh; width: 100%; max-width: 100%; overflow: hidden; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: var(--nav-w); flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 8px; gap: 4px;
    transition: width .18s ease; overflow: hidden;
  }
  body.nav-open #sidebar { width: var(--nav-w-open); }
  .logo {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 4px 0 12px;
  }
  .logo-mark {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 9px;
    background: var(--brand); color: #172033;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px;
  }
  .logo-name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; opacity: 0; transition: opacity .15s ease .04s; white-space: nowrap; }
  body.nav-open .logo-name { opacity: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; height: 40px; border-radius: 8px; flex-shrink: 0;
    color: var(--muted); font-weight: 500; white-space: nowrap;
    padding: 0 0; justify-content: center;
    transition: background .12s ease, color .12s ease;
  }
  .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
  .nav-item:hover { background: #F5F4F1; color: var(--text); }
  .nav-item.active { background: #FFE9A3; color: #172033; }
  .nav-item.active:hover { background: #FFE28C; }
  .nav-label { opacity: 0; transition: opacity .12s ease; }
  body.nav-open .nav-label { opacity: 1; }
  body.nav-open .nav-item { justify-content: flex-start; padding: 0 14px; }
  body.nav-open .logo { padding: 4px 14px 12px; }
  .nav-spacer { flex: 1; }

  /* ---------- Main column ---------- */
  .main, #main-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; width: 100%; max-width: 100%; }
  #topbar {
    height: 56px; flex-shrink: 0; background: var(--panel);
    border-bottom: 1px solid var(--line);
    box-shadow: inset 0 3px 0 var(--brand);
    display: flex; align-items: center; gap: 14px; padding: 0 20px;
  }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); transition: background .12s, color .12s;
  }
  .icon-btn:hover { background: #F5F4F1; color: var(--text); }
  .icon-btn svg { width: 19px; height: 19px; }
  #page-title { font-size: 15px; font-weight: 600; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 0 10px; height: 34px; width: 220px;
    transition: border-color .12s;
  }
  .search-box:focus-within { border-color: var(--brand); }
  .search-box svg { width: 15px; height: 15px; color: var(--faint); flex-shrink: 0; }
  .search-box input { border: 0; outline: 0; background: none; width: 100%; font-size: 13px; }
  .search-box input::placeholder { color: var(--faint); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--brand-soft); color: #172033;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px; border: 1px solid #F3E3AE;
  }

  #view { flex: 1; overflow-y: auto; padding: 24px 28px; }
  .view-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  .view-head h1, .view-head .greet { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .view-head p, .view-head .sub { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
  .view-head .spacer { flex: 1; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 14px; border-radius: 8px;
    font-weight: 600; font-size: 13.5px;
    transition: background .12s, border-color .12s, color .12s;
    white-space: nowrap;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn-primary { background: var(--brand); color: #172033; }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-ghost { border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .btn-ghost:hover { background: #F5F4F1; }
  .btn-danger-ghost { border: 1px solid #F0D3D0; background: var(--panel); color: var(--bad); }
  .btn-danger-ghost:hover { background: var(--bad-bg); }

  /* ---------- Cards / sections ---------- */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .card-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 18px; border-bottom: 1px solid var(--line-soft);
  }
  .card-head h2 { font-size: 14.5px; font-weight: 600; }
  .card-head .link { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--ink); }
  .card-body { padding: 4px 0; }

  .metrics {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    width: 100%;
    margin-bottom: 24px;
  }
  .metric {
    background: #FFF3C4; border: 1px solid #F0D98C; border-radius: 10px;
    padding: 20px 22px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .m-label { display: block; font-size: 12.5px; color: #8A6100; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
  .m-val { display: block; font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 8px; color: #172033; }
  .m-sub { display: block; font-size: 12.5px; color: var(--faint); margin-top: 4px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }

  /* ---------- Rows / lists ---------- */
  .list-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 18px; cursor: pointer;
    border-top: 1px solid var(--line-soft);
    transition: background .1s;
  }
  .list-row:first-child { border-top: 0; }
  .list-row:hover { background: #FAFAF8; }
  .list-row .grow { flex: 1; min-width: 0; }
  .list-row .t1 { font-weight: 500; font-size: 13.5px; }
  .list-row .t2 { color: var(--muted); font-size: 12.5px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-row .t3 { color: var(--faint); font-size: 12px; flex-shrink: 0; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); flex-shrink: 0; }
  .avatar-sm {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: var(--brand-soft); color: #172033;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 12.5px;
  }

  /* ---------- Status chips ---------- */
  .chip {
    display: inline-flex; align-items: center;
    height: 22px; padding: 0 9px; border-radius: 6px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .chip-pending  { background: var(--accent-bg, #FDF3D0); color: #8A6100; }
  .chip-shipped  { background: #EEF0F3; color: #43506A; }
  .chip-delivered, .chip-completed { background: var(--ok-bg); color: var(--ok); }
  .chip-cancelled { background: var(--bad-bg); color: var(--bad); }

  /* ---------- Tables ---------- */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 12px; font-weight: 600; color: var(--faint);
    text-transform: none; letter-spacing: .01em;
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td { padding: 12px 18px; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .1s; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: #FAFAF8; }
  td .cell-sub { color: var(--faint); font-size: 12px; margin-top: 1px; }
  td.num, th.num { text-align: right; }
  .td-strong { font-weight: 600; }

  /* ---------- Filters ---------- */
  .filters { display: flex; gap: 2px; align-items: center; margin-bottom: 14px; }
  .filter {
    padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 500;
    color: var(--muted); transition: background .12s, color .12s;
  }
  .filter:hover { background: #F5F4F1; color: var(--text); }
  .filter.active { background: var(--brand-soft); color: #172033; font-weight: 600; }
  .filters .spacer { flex: 1; }
  .filters .search-box { width: 200px; height: 32px; }

  /* ---------- Conversations ---------- */
  .conv-layout { display: grid; grid-template-columns: 340px 1fr; gap: 0; height: calc(100vh - 56px - 48px); }
  .conv-list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-radius: 10px 0 0 10px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .conv-list-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line-soft); }
  .conv-list-head h2 { font-size: 14.5px; font-weight: 600; margin-bottom: 10px; }
  .conv-list .search-box { width: 100%; height: 32px; }
  .conv-items { flex: 1; overflow-y: auto; }
  .conv-item {
    display: flex; gap: 10px; padding: 12px 16px; cursor: pointer;
    border-bottom: 1px solid var(--line-soft);
    transition: background .1s;
  }
  .conv-item:hover { background: #FAFAF8; }
  .conv-item.active { background: #FFF3C4; }
  .conv-item:hover { background: #F6F4EF; }
  .conv-item .c-top { display: flex; align-items: center; gap: 8px; }
  .conv-item .c-name { font-weight: 600; font-size: 13.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item .c-time { font-size: 11.5px; color: var(--faint); flex-shrink: 0; }
  .conv-item .c-msg { color: var(--muted); font-size: 12.5px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item.unread .c-name { color: #172033; }
  .conv-item.unread .c-msg { color: var(--text); font-weight: 500; }

  .conv-thread { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .thread-head {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .thread-head .t-name { font-weight: 600; font-size: 14.5px; }
  .thread-head .t-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .thread-head .spacer { flex: 1; }
  .messages {
    flex: 1; overflow-y: auto; padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 62%; padding: 9px 13px; border-radius: 10px; font-size: 13.5px; line-height: 1.45; }
  .msg.in { align-self: flex-start; background: #F3F2EE; border-bottom-left-radius: 3px; }
  .msg.out { align-self: flex-end; background: #FFF3C4; border-bottom-right-radius: 3px; }
  .msg .m-time { display: block; font-size: 11px; color: var(--faint); margin-top: 3px; }
  .composer {
    display: flex; gap: 10px; padding: 12px 18px;
    border-top: 1px solid var(--line); background: var(--panel);
    border-radius: 0 0 10px 10px;
  }
  .composer input {
    flex: 1; height: 38px; border: 1px solid var(--line); border-radius: 8px;
    padding: 0 12px; outline: none; font-size: 13.5px; background: var(--panel);
    transition: border-color .12s;
  }
  .composer input:focus { border-color: var(--brand); }
  .composer .btn { height: 38px; }

  /* ---------- Progress steps ---------- */
  .steps { display: flex; align-items: flex-start; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 7px; flex-shrink: 0; width: 92px; }
  .step:first-child { margin-left: 4px; }
  .step:last-child { margin-right: 4px; }
  .step .dot {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel); border: 2px solid var(--line);
    color: var(--faint); font-size: 12px; font-weight: 700;
    transition: all .15s;
  }
  .step .dot svg { width: 14px; height: 14px; }
  .step .s-label { font-size: 12px; color: var(--faint); font-weight: 500; text-align: center; }
  .step.done .dot { background: var(--ok-bg); border-color: #CDE8D6; color: var(--ok); }
  .step.done .s-label { color: var(--muted); }
  .step.current .dot { background: var(--brand); border-color: var(--brand); color: #172033; }
  .step.current .s-label { color: #172033; font-weight: 700; }
  .step-line { flex: 1; height: 2px; background: var(--line); margin-top: 12px; min-width: 14px; }
  .step-line.done { background: #CDE8D6; }

  /* ---------- Detail layouts ---------- */
  .detail-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 16px; padding: 16px 18px; }
  .kv .k { color: var(--muted); font-size: 13px; padding-top: 1px; }
  .kv .v { font-size: 13.5px; font-weight: 500; }
  .kv .v.mono { font-weight: 400; }

  /* ---------- Empty state ---------- */
  .empty { padding: 44px 20px; text-align: center; }
  .empty h3 { font-size: 14.5px; font-weight: 600; }
  .empty p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .empty .btn { margin-top: 14px; }

  /* ---------- Panel (side drawer) ---------- */
  #panel-overlay {
    position: fixed; inset: 0; background: rgba(23, 32, 51, .28);
    opacity: 0; pointer-events: none; transition: opacity .18s ease; z-index: 50;
  }
  #panel-overlay.open { opacity: 1; pointer-events: auto; }
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .2s ease; z-index: 51;
    display: flex; flex-direction: column;
  }
  #panel.open { transform: translateX(0); }
  .panel-head { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { font-size: 15.5px; font-weight: 700; }
  .panel-head .icon-btn { margin-left: auto; }
  .panel-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
  .panel-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .panel-foot .btn-primary { flex: 1; justify-content: center; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    #sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 60; box-shadow: 0 0 0 1px rgba(23,32,51,.04); }
    body.nav-open #sidebar { width: var(--nav-w-open); box-shadow: 0 8px 30px rgba(23,32,51,.14); }
    body:not(.nav-open) #main-wrap { margin-left: 0; }
    .detail-grid { grid-template-columns: 1fr; }
    .view-head-row { flex-wrap: wrap; }
    .filters { overflow-x: auto; max-width: 100%; }
    #conv-layout { grid-template-columns: 1fr; }
    #conv-layout .conv-detail { display: none; }
    body.conv-open #conv-layout .conv-list { display: none; }
    body.conv-open #conv-layout .conv-detail { display: flex; }
    .steps { overflow-x: auto; padding-bottom: 6px; }
    table.tbl { display: block; overflow-x: auto; }
  }

  @media (max-width: 768px) {
    .metrics { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr; }
    #view { padding: 16px 14px; }
    #topbar { padding: 0 12px; gap: 8px; }
    #topbar .search-box { display: none; }
    .page-head { flex-direction: column; gap: 8px; }
    .view-head { flex-direction: column; gap: 8px; }
    #topbar h1 { font-size: 16px; }
    .card { max-width: 100%; }
    .btn { white-space: normal; }
  }

  /* ---------- Forms & misc ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .field input, .field select, .field textarea {
    font: inherit; font-size: 14px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; outline: none; width: 100%;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--brand-hover); box-shadow: 0 0 0 3px var(--brand-soft);
  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .item-row { display: grid; grid-template-columns: 1fr 64px 96px 32px; gap: 8px; align-items: start; margin-bottom: 10px; }
  .item-row .field { margin-bottom: 0; }
  .total-row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 15px; padding: 14px 0 2px; margin-top: 6px; border-top: 1px solid var(--line-soft); }
  .prod-cell { display: flex; align-items: center; gap: 10px; }
  .prod-img { width: 36px; height: 36px; border-radius: 6px; background: var(--brand-soft); border: 1px solid var(--line-soft); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--ink); object-fit: cover; flex-shrink: 0; }
  .link { color: var(--brand-hover); font-weight: 600; cursor: pointer; background: none; border: none; font: inherit; padding: 0; }
  .link:hover { text-decoration: underline; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 600; background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 14px; }
  .back-link:hover { color: var(--text); }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .stack .card-head h2 { font-size: 14.5px; }

  /* ---------- Missing styles / spacing fixes ---------- */
  .card-head h3 { font-size: 14.5px; font-weight: 600; }
  .page-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-head .page-title { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .page-head .page-sub { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .conv-list-top { padding: 14px 16px 10px; border-bottom: 1px solid var(--line-soft); }
  .search-box.slim { width: 100%; height: 32px; }
  .conv-item .ci-top { display: flex; align-items: center; gap: 8px; }
  .conv-item .ci-name { font-weight: 600; font-size: 13.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item .ci-time { font-size: 11.5px; color: var(--faint); flex-shrink: 0; }
  .conv-item .ci-last { color: var(--muted); font-size: 12.5px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-item.unread .ci-name { color: #172033; }
  .conv-item.unread .ci-last { color: var(--text); font-weight: 500; }
  .conv-head { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .conv-head .ch-meta { flex: 1; min-width: 0; }
  .conv-head .ch-name { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-head .ch-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .chat .m-body { overflow-wrap: break-word; }
  .ov-list { display: flex; flex-direction: column; }
  .ov-row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 18px; border-bottom: 1px solid var(--line-soft);
    color: var(--text); text-decoration: none; font-size: 13px;
    transition: background .12s;
  }
  .ov-row:last-child { border-bottom: 0; }
  .ov-row:hover { background: #FAFAF8; }
  .ov-num { color: var(--muted); font-size: 12px; flex-shrink: 0; min-width: 52px; }
  .ov-name { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ov-total { margin-left: auto; font-weight: 600; flex-shrink: 0; }
  .ov-last { color: var(--muted); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ov-time { font-size: 11.5px; color: var(--faint); flex-shrink: 0; margin-left: auto; }
  .ov-time + .chip, .ov-last + .chip { margin-left: 0; }
  .row-link { cursor: pointer; }
  .steps-wrap { padding: 16px 18px 18px; }
  .sel-item { width: 100%; font: inherit; font-size: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; outline: none; }
  .sel-item:focus { border-color: var(--brand-hover); box-shadow: 0 0 0 3px var(--brand-soft); }
  .panel-actions { display: flex; gap: 10px; margin-bottom: 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .strong { font-weight: 600; }
  .conv-row { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .conv-row:last-child { border-bottom: 0; }
  .conv-row:hover { background: #FAFAF8; }
  .conv-row .grow { flex: 1; min-width: 0; }
  .wide { max-width: none; }
  .chip.s-pending { background: var(--accent-bg, #FDF3D0); color: #8A6100; }
  .chip.s-shipped { background: #EEF0F3; color: #43506A; }
  .chip.s-delivered { background: var(--ok-bg); color: var(--ok); }
  .chip.s-cancelled { background: var(--bad-bg); color: var(--bad); }
</style>
</head>
<body>
<div class="shell">
  <aside id="sidebar">
    <div class="logo">
      <div class="logo-mark">K</div>
      <span class="logo-name">Kereshop</span>
    </div>
    <nav id="nav" aria-label="Main"></nav>
    <button class="nav-item" data-nav="settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="nav-label">Settings</span>
    </button>
  </aside>

  <div id="main-wrap">
    <header id="topbar">
      <button id="menu-btn" class="icon-btn" title="Menu" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <h1 id="page-title">Overview</h1>
      <div class="top-right">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="global-search" type="search" placeholder="Search customers, orders…" />
        </div>
        <button class="icon-btn" id="bell-btn" title="Notifications" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <div class="avatar" title="Amara">A</div>
      </div>
    </header>

    <main id="view"></main>
  </div>
</div>

<div id="panel-overlay"></div>
<aside id="panel" aria-hidden="true"></aside>
<div id="toast"></div>

<script>
/* ============ Kereshop dashboard ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const API = {
  get:  p => fetch(p).then(r => r.json()),
  post: (p, b) => fetch(p, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b || {}) }).then(r => r.json()),
  put:  (p, b) => fetch(p, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b || {}) }).then(r => r.json()),
  patch: (p, b) => fetch(p, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b || {}) }).then(r => r.json()),
};

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const Naira = n => "₦" + Math.round(Number(n || 0)).toLocaleString("en-NG");

const STATUS = {
  pending:   { label: "Preparing",         cls: "s-pending" },
  shipped:   { label: "Out for delivery",  cls: "s-shipped" },
  delivered: { label: "Delivered",         cls: "s-delivered" },
  completed: { label: "Completed",         cls: "s-delivered" },
  cancelled: { label: "Cancelled",         cls: "s-cancelled" },
};
const statusChip = s => {
  const m = STATUS[s] || { label: s, cls: "s-pending" };
  return `<span class="chip ${m.cls}">${esc(m.label)}</span>`;
};

function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = bad ? "show bad" : "show";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.className = ""), 2600);
}

function timeAgo(iso) {
  if (!iso) return "";
  const d = new Date(iso.replace(" ", "T") + "Z");
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  if (s < 86400 * 7) return Math.floor(s / 86400) + " d ago";
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}

function shortDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso.replace(" ", "T") + "Z");
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}

/* ============ Navigation ============ */
const NAV = [
  { id: "overview",      label: "Overview",      hash: "#/",        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>' },
  { id: "conversations", label: "Conversations", hash: "#/conversations", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>' },
  { id: "orders",        label: "Orders",        hash: "#/orders",   icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 11V7a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v4"/><path d="M4 11h16l-1.5 9a2 2 0 0 1-2 1.6h-9A2 2 0 0 1 5.5 20z"/></svg>' },
  { id: "customers",     label: "Customers",     hash: "#/customers",icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>' },
  { id: "products",      label: "Products",      hash: "#/products", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>' },
  { id: "integrations",  label: "Integrations",  hash: "#/integrations", icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>' },
];

function buildNav() {
  $("#nav").innerHTML = NAV.map(n =>
    `<button class="nav-item" data-nav="${n.id}" data-hash="${n.hash}" title="${esc(n.label)}">
       ${n.icon}<span class="nav-label">${esc(n.label)}</span>
     </button>`
  ).join("");
  $$("#nav .nav-item").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.hash; closeNavIfMobile(); }));
  $("#sidebar .logo").addEventListener("click", () => (location.hash = "#/"));
}

function setActiveNav(id) {
  $$("#sidebar .nav-item").forEach(b => b.classList.toggle("active", b.dataset.nav === id));
}

/* ============ Router ============ */
let viewToken = 0;
async function route() {
  const token = ++viewToken;
  const h = location.hash || "#/";
  const view = $("#view");
  document.body.classList.remove("conv-open");

  let m;
  if (h === "#/" || h === "#") {
    setActiveNav("overview"); renderView("Overview", () => viewOverview(token));
  } else if (h.startsWith("#/conversations/")) {
    setActiveNav("conversations"); viewConversations(token, h.split("/").pop());
  } else if (h === "#/conversations") {
    setActiveNav("conversations"); viewConversations(token, null);
  } else if (h.startsWith("#/orders/") || h.startsWith("#/order/")) {
    setActiveNav("orders"); renderView("Order #" + h.split("/").pop(), () => viewOrderDetail(token, h.split("/").pop()));
  } else if (h === "#/orders" || h === "#/order") {
    setActiveNav("orders"); viewOrders(token);
  } else if (h.startsWith("#/customers/")) {
    setActiveNav("customers"); renderView("Customer", () => viewCustomerDetail(token, h.split("/").pop()));
  } else if (h === "#/customers") {
    setActiveNav("customers"); viewCustomers(token);
  } else if (h === "#/products") {
    setActiveNav("products"); viewProducts(token);
  } else if (h === "#/integrations") {
    setActiveNav("integrations"); renderView("Integrations", () => viewIntegrations(token));
  } else if (h === "#/settings") {
    setActiveNav("settings"); renderView("Settings", () => viewSettings(token));
  } else {
    setActiveNav("overview"); renderView("Overview", () => viewOverview(token));
  }
}

function renderView(title, fn) {
  $("#page-title").textContent = title;
  fn();
}

window.addEventListener("hashchange", route);
$("#menu-btn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
function closeNavIfMobile() { if (window.innerWidth < 860) document.body.classList.remove("nav-open"); }

/* ============ OVERVIEW ============ */
async function viewOverview(token) {
  const v = $("#view");
  v.innerHTML = `<div class="page">
    <div class="view-head">
      <div>
        <h2 class="greet">Good morning, Amara</h2>
        <p class="sub">Here's what needs your attention.</p>
      </div>
    </div>
    <div class="metrics" id="ov-metrics">
      <div class="metric"><span class="m-label">Orders today</span><span class="m-val" id="m-orders">—</span></div>
      <div class="metric"><span class="m-label">Sales today</span><span class="m-val" id="m-sales">—</span></div>
      <div class="metric"><span class="m-label">To prepare</span><span class="m-val" id="m-prepare">—</span></div>
    </div>
    <div class="detail-grid">
      <section class="card">
        <div class="card-head"><h3>Recent orders</h3><a href="#/orders" class="link">View all</a></div>
        <div id="ov-orders"><div class="empty"><p>Loading…</p></div></div>
      </section>
      <section class="card">
        <div class="card-head"><h3>Recent conversations</h3><a href="#/conversations" class="link">View all</a></div>
        <div id="ov-conv"><div class="empty"><p>Loading…</p></div></div>
      </section>
    </div>
  </div>`;

  try {
    const [orders, conv] = await Promise.all([API.get("/api/orders"), API.get("/api/conversations")]);
    if (token !== viewToken) return;
    const list = orders.orders || [];
    const today = new Date().toDateString();
    const isToday = iso => { try { return new Date(iso.replace(" ", "T") + "Z").toDateString() === today; } catch (e) { return false; } };
    const todays = list.filter(o => isToday(o.created_at));
    const prep = list.filter(o => o.status === "pending");
    $("#m-orders").textContent = todays.length;
    $("#m-sales").textContent = Naira(todays.reduce((a, o) => a + Number(o.total || 0), 0));
    $("#m-prepare").textContent = prep.length;

    const rows = list.slice(0, 5);
    $("#ov-orders").innerHTML = rows.length ? `<div class="ov-list">` + rows.map(o =>
      `<a class="ov-row" href="#/orders/${o.id}">
         <span class="ov-num">#${esc(o.order_number || o.id)}</span>
         <span class="ov-name">${esc(o.customer_name || "Customer")}</span>
         <span class="ov-total">${Naira(o.total)}</span>
         ${statusChip(o.status)}
       </a>`).join("") + `</div>` : emptyBox("No orders yet", "New orders will appear here.");

    const cList = (conv.conversations || []).slice(0, 4);
    $("#ov-conv").innerHTML = cList.length ? `<div class="ov-list">` + cList.map(c =>
      `<a class="ov-row" href="#/conversations/${c.id}">
         <span class="ov-name">${esc(c.customer_name || "Customer")}</span>
         <span class="ov-last">${esc(c.last_message_body || "—")}</span>
         <span class="ov-time">${timeAgo(c.last_message_at)}</span>
       </a>`).join("") + `</div>` : emptyBox("No conversations yet", "Replies from WhatsApp land here.");
  } catch (e) {
    if (token !== viewToken) return;
    v.innerHTML = errorBox(e);
  }
}

/* ============ CONVERSATIONS ============ */
let convSearch = "";
async function viewConversations(token, selectedId) {
  const v = $("#view");
  v.innerHTML = `<div class="page page-conv">
    <div class="view-head">
      <div><h2 class="greet">Conversations</h2><p class="sub">Keep track of every chat.</p></div>
    </div>
    <div id="conv-layout">
      <div class="conv-list card">
        <div class="conv-list-top">
          <div class="search-box slim"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="conv-search" type="search" placeholder="Search chats…" value="${esc(convSearch)}"></div>
        </div>
        <div id="conv-items"><div class="empty"><p>Loading…</p></div></div>
      </div>
      <div class="conv-detail card" id="conv-detail"></div>
    </div>
  </div>`;
  $("#page-title").textContent = "Conversations";
  $("#conv-search").addEventListener("input", e => { convSearch = e.target.value; loadConvList(token); });
  loadConvList(token);
  if (selectedId) openConversation(token, selectedId);
  else $("#conv-detail").innerHTML = emptyBox("Pick a conversation", "Select a chat to see the full thread.");
}

async function loadConvList(token) {
  const box = $("#conv-items");
  if (!box) return;
  const q = convSearch.trim();
  const url = "/api/conversations" + (q ? "?q=" + encodeURIComponent(q) : "");
  const data = await API.get(url);
  if (token !== viewToken) return;
  const list = data.conversations || [];
  if (!list.length) { box.innerHTML = emptyBox("No chats found", q ? "Try a different search." : "New chats appear here."); return; }
  box.innerHTML = list.map(c => {
    const active = location.hash === "#/conversations/" + c.id;
    return `<button class="conv-item ${active ? "active" : ""} ${c.unread ? "unread" : ""}" data-id="${c.id}">
      <div class="ci-top"><span class="ci-name">${esc(c.customer_name || "Customer")}</span><span class="ci-time">${timeAgo(c.last_message_at)}</span></div>
      <div class="ci-last">${esc(c.last_message_body || "No messages yet")}</div>
    </button>`;
  }).join("");
  $$("#conv-items .conv-item").forEach(b => b.addEventListener("click", () => openConversation(token, b.dataset.id)));
}

async function openConversation(token, id) {
  const detail = $("#conv-detail");
  detail.innerHTML = `<div class="empty"><p>Loading…</p></div>`;
  document.body.classList.remove("nav-open");
  const data = await API.get(`/api/conversations/${id}`);
  if (token !== viewToken) return;
  const c = data.conversation;
  API.post(`/api/conversations/${id}/read`).catch(() => {});
  detail.innerHTML = `
    <div class="conv-head">
      <div class="avatar">${esc((c.customer_name || "C").trim().charAt(0).toUpperCase())}</div>
      <div class="ch-meta">
        <div class="ch-name">${esc(c.customer_name || "Customer")}</div>
        <div class="ch-sub">${esc(c.customer_phone || "")}</div>
      </div>
      <button class="btn btn-primary" id="conv-create-order">${icon("plus")} Create order</button>
    </div>
    <div class="chat" id="chat-box"></div>
    <div class="composer">
      <input id="msg-input" type="text" placeholder="Write a reply…" autocomplete="off" />
      <button class="btn btn-primary" id="msg-send">Send</button>
    </div>`;
  $("#conv-create-order").addEventListener("click", () =>
    openCreateOrder({ customer_id: c.customer_id, customer_name: c.customer_name, conversation_id: id }));
  $("#msg-send").addEventListener("click", () => sendMsg(token, id));
  $("#msg-input").addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(token, id); });
  renderMessages($$("#chat-box").length && $("#chat-box"), c.messages || []);
}

function renderMessages(box, msgs) {
  if (!box) return;
  box.innerHTML = msgs.length
    ? msgs.map(m => `<div class="msg ${m.direction === "outbound" ? "out" : "in"}"><div class="m-body">${esc(m.body)}</div><div class="m-time">${fmtTime(m.created_at)}</div></div>`).join("")
    : `<div class="empty"><h3>No messages yet</h3><p>WhatsApp messages will appear here.</p></div>`;
  box.scrollTop = box.scrollHeight;
}

async function sendMsg(token, id) {
  const input = $("#msg-input");
  const text = (input.value || "").trim();
  if (!text) return;
  input.value = "";
  try {
    await API.post(`/api/conversations/${id}/messages`, { body: text, direction: "outbound" });
    const data = await API.get(`/api/conversations/${id}`);
    if (token !== viewToken) return;
    renderMessages($("#chat-box"), data.conversation.messages || []);
    loadConvList(token);
  } catch (e) { toast("Could not send message", true); }
}

/* ---------- Orders ---------- */
let orderFilter = "all";

const ORDER_FILTERS = [
  ["all", "All"], ["pending", "Preparing"], ["shipped", "Out for delivery"], ["delivered", "Delivered"]
];

function pageHead(title, sub, actionHtml) {
  return `<div class="page-head">
    <div><h1 class="page-title">${esc(title)}</h1>${sub ? `<p class="page-sub">${esc(sub)}</p>` : ""}</div>
    ${actionHtml || ""}
  </div>`;
}

function emptyBox(title, sub, btnHtml) {
  return `<div class="empty"><h3>${esc(title)}</h3><p>${esc(sub)}</p>${btnHtml || ""}</div>`;
}

async function renderOrders(token) {
  const view = $("#view");
  view.innerHTML = pageHead("Orders", "Keep every order in one place.",
    `<button class="btn btn-primary" id="btn-new-order">+ New order</button>`) +
    `<div class="card">
      <div class="filters" id="order-filters">
        ${ORDER_FILTERS.map(([f, l]) => `<button class="filter ${f === "all" ? "active" : ""}" data-f="${f}">${l}</button>`).join("")}
      </div>
      <div id="orders-body"><div class="empty"><p>Loading…</p></div></div>
    </div>`;
  $("#btn-new-order").addEventListener("click", () => openCreateOrder({}));
  $$("#order-filters .filter").forEach(b => b.addEventListener("click", () => {
    orderFilter = b.dataset.f;
    $$("#order-filters .filter").forEach(x => x.classList.toggle("active", x === b));
    loadOrders(token);
  }));
  loadOrders(token);
}

async function loadOrders(token) {
  const box = $("#orders-body");
  if (!box) return;
  const data = await API.get("/api/orders");
  if (token !== viewToken) return;
  let list = data.orders || [];
  if (orderFilter === "delivered") list = list.filter(o => o.status === "delivered" || o.status === "completed");
  else if (orderFilter !== "all") list = list.filter(o => o.status === orderFilter);
  if (!list.length) { box.innerHTML = emptyBox("No orders here", orderFilter === "all" ? "Orders you create will show up here." : "Nothing in this state right now."); return; }
  box.innerHTML = `<table class="tbl">
    <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th></tr></thead>
    <tbody>${list.map(o => `<tr class="row-link" data-id="${o.id}">
      <td class="strong">#${esc(o.order_number || o.id)}</td>
      <td>${esc(o.customer_name || "Customer")}</td>
      <td>${o.item_count || 1}</td>
      <td class="num">${Naira(o.total)}</td>
      <td>${statusChip(o.status)}</td>
      <td class="muted">${fmtDate(o.created_at)}</td>
    </tr>`).join("")}</tbody></table>`;
  $$("#orders-body .row-link").forEach(tr => tr.addEventListener("click", () => location.hash = `#/orders/${tr.dataset.id}`));
}

const STEPS = [
  ["pending", "Preparing"], ["shipped", "Out for delivery"], ["delivered", "Delivered"]
];

function stepsHtml(status) {
  const curIdx = status === "completed" ? 4 : STEPS.findIndex(s => s[0] === status);
  return `<div class="steps">${STEPS.map(([key, label], i) => {
    const cls = i < curIdx ? "done" : i === curIdx ? "current" : "";
    const dot = i < curIdx ? icon("check", 14) : i + 1;
    return `${i ? `<div class="step-line ${i <= curIdx ? "done" : ""}"></div>` : ""}
      <div class="step ${cls}"><div class="dot">${dot}</div><div class="s-label">${label}</div></div>`;
  }).join("")}</div>`;
}

function icon(name, size = 15) {
  const paths = {
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
    chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  };
  return `<svg style="width:${size}px;height:${size}px;vertical-align:-2px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name] || ""}</svg>`;
}

function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const today = new Date().toDateString() === d.toDateString();
  return today ? "Today" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

function fmtDateTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const day = d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  const time = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  const today = new Date().toDateString() === d.toDateString();
  return (today ? "today, " : day + ", ") + time;
}

/* ---------- create order ---------- */
async function openCreateOrder(ctx) {
  ctx = ctx || {};
  const data = await API.get("/api/customers").catch(() => ({ customers: [] }));
  const customers = data.customers || [];
  const prods = await API.get("/api/products").catch(() => ({ products: [] }));
  const products = prods.products || [];
  const rows = [{ desc: ctx.item_desc || "", qty: 1, price: ctx.item_price || "" }];
  const render = () => {
    const lineHtml = rows.map((r, i) => `
      <div class="item-row" data-i="${i}">
        <div class="field">
          <label>Item</label>
          <select class="sel-item" data-i="${i}">
            <option value="">Type it below</option>
            ${products.map(p => `<option value="${p.id}" data-price="${p.price}" ${r.desc === p.name ? "selected" : ""}>${esc(p.name)} — ${Naira(p.price)}</option>`).join("")}
          </select>
          <input class="input in-desc" data-i="${i}" value="${esc(r.desc)}" placeholder="e.g. Black Dress, size 12" style="margin-top:6px" />
        </div>
        <div class="field"><label>Qty</label><input class="input in-qty" type="number" min="1" data-i="${i}" value="${r.qty}" /></div>
        <div class="field"><label>Price (₦)</label><input class="input in-price" type="number" min="0" data-i="${i}" value="${r.price}" /></div>
        <button class="icon-btn in-del" data-i="${i}" title="Remove" style="margin-top:21px;align-self:start">${icon("x", 14)}</button>
      </div>`).join("");
    const total = rows.reduce((s, r) => s + (Number(r.qty) || 0) * (Number(r.price) || 0), 0);
    $("#panel").innerHTML = `
      <div class="panel-head"><h2>Create order</h2><button class="icon-btn" id="panel-close" title="Close">${icon("x", 15)}</button></div>
      <div class="panel-body">
        <div class="field">
          <label>Customer</label>
          <select id="co-customer" ${ctx.customer_id ? "disabled" : ""}>
            ${customers.map(c => `<option value="${c.id}" ${ctx.customer_id === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
          </select>
        </div>
        <label class="field" style="margin-bottom:8px"><span style="font-size:12.5px;font-weight:600;color:var(--muted)">Items</span></label>
        <div id="co-items">${lineHtml}</div>
        <button class="btn btn-ghost" id="co-add-item" style="margin-bottom:14px">${icon("plus", 14)} Add item</button>
        <div class="field-row">
          <div class="field"><label>Delivery note</label><input class="input" id="co-delivery" placeholder="e.g. Tomorrow, 10:00 AM" value="${esc(ctx.delivery || "")}" /></div>
          <div class="field"><label>Delivery fee (₦)</label><input class="input" id="co-fee" type="number" min="0" value="0" /></div>
        </div>
        <div class="total-row"><span>Total</span><span id="co-total">${Naira(total)}</span></div>
        <div class="field"><label>Notes (optional)</label><textarea class="input" id="co-notes" rows="2" placeholder="Anything else the customer asked for"></textarea></div>
      </div>
      <div class="panel-foot">
        <button class="btn btn-ghost" id="co-cancel">Cancel</button>
        <button class="btn btn-primary" id="co-create">Create order</button>
      </div>`;
    $("#panel-close").addEventListener("click", closePanel);
    $("#co-cancel").addEventListener("click", closePanel);
    $("#co-add-item").addEventListener("click", () => { rows.push({ desc: "", qty: 1, price: "" }); render(); });
    $$(".item-row", $("#panel")).forEach(rowEl => {
      const i = Number(rowEl.dataset.i);
      const sel = rowEl.querySelector(".sel-item");
      sel.addEventListener("change", () => {
        const opt = sel.selectedOptions[0];
        if (sel.value) { rows[i].desc = opt.text.split(" — ")[0]; rows[i].price = opt.dataset.price || ""; }
        else rows[i].desc = "";
        render();
      });
      rowEl.querySelector(".in-desc").addEventListener("input", e => { rows[i].desc = e.target.value; });
      rowEl.querySelector(".in-qty").addEventListener("input", e => { rows[i].qty = Number(e.target.value) || 0; refreshTotal(); });
      rowEl.querySelector(".in-price").addEventListener("input", e => { rows[i].price = Number(e.target.value) || 0; refreshTotal(); });
      rowEl.querySelector(".in-del").addEventListener("click", () => { if (rows.length > 1) { rows.splice(i, 1); render(); } });
    });
    function refreshTotal() {
      const t = rows.reduce((s, r) => s + (Number(r.qty) || 0) * (Number(r.price) || 0), 0);
      const fee = Number($("#co-fee").value) || 0;
      $("#co-total").textContent = Naira(t + fee);
    }
    $("#co-fee").addEventListener("input", refreshTotal);
    $("#co-create").addEventListener("click", async () => {
      const btn = $("#co-create");
      btn.disabled = true;
try {
          // keep simple: no product link unless exact name match
          const clean = rows.map(r => {
          const p = products.find(x => x.name === r.desc);
          return p
            ? { product_id: p.id, description: r.desc, quantity: Number(r.qty) || 1, unit_price: Number(r.price) || p.price }
            : { description: r.desc || "Item", quantity: Number(r.qty) || 1, unit_price: Number(r.price) || 0 };
        }).filter(r => r.description);
        if (!clean.length) { toast("Add at least one item", true); return; }
        const res = await API.post("/api/orders", {
          customer_id: Number($("#co-customer").value),
          items: clean,
          delivery_fee: Number($("#co-fee").value) || 0,
          notes: ($("#co-notes").value || "").trim() || null,
          delivery_address: ($("#co-delivery").value || "").trim() || null,
          conversation_id: ctx.conversation_id || null,
          is_manual: !ctx.conversation_id,
        });
        toast("Order created");
        closePanel();
        if (res.order) location.hash = "#/orders/" + res.order.id;
        else location.hash = "#/orders";
      } catch (e) { toast("Could not create order", true); }
      btn.disabled = false;
    });
  };
  render();
  openPanel($("#panel").innerHTML);
}

function openAddProduct(existing) {
  const panel = $("#panel");
  panel.innerHTML = `
    <div class="panel-head">
      <h2>${existing ? "Edit product" : "Add product"}</h2>
      <button class="icon-btn" id="p-close" aria-label="Close">${icon("x")}</button>
    </div>
    <div class="panel-body">
      <div class="field"><label>Name</label><input id="pp-name" placeholder="e.g. Black Dress" /></div>
      <div class="field"><label>Price (₦)</label><input id="pp-price" type="number" min="0" placeholder="35000" /></div>
      <div class="field"><label>Stock</label><input id="pp-stock" type="number" min="0" placeholder="10" /></div>
      <div class="field"><label>Image URL (optional)</label><input id="pp-img" placeholder="https://…" /></div>
      <div class="field"><label>Description (optional)</label><textarea id="pp-desc" rows="3" placeholder="Short description"></textarea></div>
      <div class="panel-actions">
        <button class="btn btn-ghost" id="p-cancel">Cancel</button>
        <button class="btn btn-primary" id="p-save">${existing ? "Save changes" : "Add product"}</button>
      </div>
    </div>`;
  if (existing) {
    $("#pp-name").value = existing.name || "";
    $("#pp-price").value = existing.price || "";
    $("#pp-stock").value = existing.stock_quantity != null ? existing.stock_quantity : "";
    $("#pp-img").value = existing.image_url || "";
    $("#pp-desc").value = existing.description || "";
  }
  $("#p-close").addEventListener("click", closePanel);
  $("#p-cancel").addEventListener("click", closePanel);
  $("#p-save").addEventListener("click", async () => {
    const body = {
      name: $("#pp-name").value.trim(),
      price: Number($("#pp-price").value) || 0,
      stock_quantity: $("#pp-stock").value === "" ? null : Number($("#pp-stock").value),
      image_url: $("#pp-img").value.trim() || null,
      description: $("#pp-desc").value.trim() || null,
    };
    if (!body.name) { toast("Give the product a name", true); return; }
    const btn = $("#p-save"); btn.disabled = true;
    try {
      if (existing) await API.patch(`/api/products/${existing.id}`, body);
      else await API.post("/api/products", body);
      toast(existing ? "Product updated" : "Product added");
      closePanel();
      viewProducts(viewToken);
    } catch (e) { toast("Could not save product", true); }
    btn.disabled = false;
  });
}

        `<div class="field"><label>${esc(c.label)}</label><input id="int-${c.key}" type="${c.type || "text"}" placeholder="${esc(c.ph)}" /></div>`
      ).join("")}
      <button class="btn btn-primary" id="int-save">Save connections</button>
    </div>
  </div>
  <div class="card" style="max-width:640px;margin-top:20px">
    <div class="card-head" style="border-bottom:1px solid var(--line)"><h2>Connected channels</h2></div>
    <div class="card-body" id="int-connected"><p class="muted" style="padding:12px 0">Loading…</p></div>
  </div>`;

  const load = async () => {
    let data = {};
    try { data = await API.get("/api/integrations"); } catch (e) { /* not connected yet */ }
    if (token !== viewToken) return;
    for (const c of INTEGRATION_CHANNELS) {
      const el = $("#int-" + c.key);
      if (el) el.value = data[c.key] || "";
    }
    const box = $("#int-connected");
    if (box) renderConnected(box, data);
  };

  $("#int-save").addEventListener("click", async () => {
    const body = {};
    for (const c of INTEGRATION_CHANNELS) {
      const el = $("#int-" + c.key);
      if (el && el.value.trim()) body[c.key] = el.value.trim();
    }
    if (!Object.keys(body).length) { toast("Connect at least one account first", true); return; }
    const btn = $("#int-save"); btn.disabled = true;
    try {
      await API.post("/api/integrations", body);
      toast("Connections saved");
      load();
    } catch (e) { toast("Could not save connections", true); }
    btn.disabled = false;
  });

  load();
}

function renderConnected(box, data) {
  const rows = INTEGRATION_CHANNELS.filter(c => !c.type || c.type === "text" || c.key === "whatsapp_number")
    .filter(c => data && data[c.key]);
  if (!rows.length) {
    box.innerHTML = `<p class="muted" style="padding:12px 0">Nothing connected yet. Fill in your WhatsApp number or social profiles above and hit <strong>Save connections</strong>.</p>`;
    return;
  }
  box.innerHTML = rows.map(c => {
    const val = data[c.key];
    const href = c.link ? c.link(val) : (String(val).startsWith("http") ? val : null);
    const right = href
      ? `<a href="${esc(href)}" target="_blank" rel="noopener" class="muted">${esc(c.linkLabel || val)}</a>`
      : `<span class="muted">${esc(c.key === "whatsapp_business_token" ? "Token stored" : val)}</span>`;
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)">
      <span style="width:20px;height:20px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px">✓</span>
      <span style="font-weight:600;font-size:13px;flex-shrink:0">${esc(c.label.replace(" (optional)", ""))}</span>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right">${right}</span>
    </div>`;
  }).join("");
}

/* ============ SETTINGS ============ */
async function viewSettings() {
  const view = $("#view");
  view.innerHTML = pageHead("Settings", "Your business details.");
  view.innerHTML += `<div class="card settings-form">
    <div class="card-head" style="border-bottom:1px solid var(--line)"><h2>Business details</h2></div>
    <div class="card-body">
      <div class="field"><label>Shop name</label><input id="set-name" placeholder="Kereshop" /></div>
      <div class="field"><label>Currency</label><input id="set-currency" placeholder="NGN" /></div>
      <div class="field"><label>Address</label><input id="set-address" placeholder="12 Marina Road, Lagos" /></div>
      <div class="field"><label>Phone</label><input id="set-phone" placeholder="+234 800 000 0000" /></div>
      <div class="field"><label>Email</label><input id="set-email" type="email" placeholder="hello@yourshop.com" /></div>
      <button class="btn btn-primary" id="set-save">Save</button>
    </div>
  </div>`;
  try {
    const s = await API.get("/api/settings");
    $("#set-name").value = s.shop_name || "";
    $("#set-currency").value = s.currency || "";
    $("#set-address").value = s.address || "";
    $("#set-phone").value = s.phone || "";
    $("#set-email").value = s.email || "";
  } catch (e) { /* defaults */ }
  $("#set-save").addEventListener("click", async () => {
    const body = {
      shop_name: $("#set-name").value.trim(),
      currency: $("#set-currency").value.trim(),
      address: $("#set-address").value.trim(),
      phone: $("#set-phone").value.trim(),
      email: $("#set-email").value.trim(),
    };
    const btn = $("#set-save"); btn.disabled = true;
    try {
      await API.put("/api/settings", body);
      toast("Settings saved");
      if (body.shop_name) {
        document.title = body.shop_name;
        const ln = $(".logo-name");
        if (ln) ln.textContent = body.shop_name;
      }
    } catch (e) { toast("Could not save settings", true); }
    btn.disabled = false;
  });
}

/* ============ GLOBAL SETTINGS (on load) ============ */
async function loadGlobalSettings() {
  try {
    const s = await API.get("/api/settings");
    if (s.shop_name) {
      document.title = s.shop_name;
      const ln = $(".logo-name");
      if (ln) ln.textContent = s.shop_name;
    }
  } catch (e) { /* keep defaults */ }
}

/* ============ GLOBAL SEARCH ============ */
let searchT;
$("#global-search").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim();
  if (!q) return;
  clearTimeout(searchT);
  const go = (tok) => (location.hash = "#/customers");
  const doSearch = async () => {
    const r = await API.get("/api/orders?q=" + encodeURIComponent(q)).catch(() => ({ orders: [] }));
    const match = (r.orders || []).find(o => o.id);
    if (match) location.hash = "#/orders/" + match.id;
    else location.hash = "#/customers";
  };
  doSearch();
});

/* ============ INIT ============ */
buildNav();
route();
loadGlobalSettings();
</script>
