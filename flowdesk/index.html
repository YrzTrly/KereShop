<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flowdesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
/* ---------- palette & base ---------- */
:root{
  --blue:#2563EB;
  --blue-hover:#1D4ED8;
  --blue-light:#EFF6FF;
  --warm:#FAFAF9;
  --ink:#172033;
  --muted:#667085;
  --line:#E7E5E4;
  --green:#1E7F4F;
  --green-bg:#F0F7F2;
  --red:#C2412F;
  --amber:#9A6B15;
  --radius:6px;
  --sidebar-w:64px;
  --sidebar-w-open:228px;
  --font:'DM Sans',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--warm);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;background:none;border:none}
a{color:var(--blue);text-decoration:none}
input,select{font-family:inherit;font-size:14px;color:var(--ink)}
svg{display:block}

/* ---------- app frame ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* ---------- sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:#fff;
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  transition:width .18s ease;
  overflow:hidden;
  z-index:40;
}
.app.nav-open .sidebar{width:var(--sidebar-w-open)}
.brand{
  height:56px;display:flex;align-items:center;gap:10px;
  padding:0 14px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.brand-mark{
  width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;
  background:var(--blue);color:#fff;font-weight:700;font-size:15px;border-radius:var(--radius);
}
.brand-name{font-weight:700;font-size:15px;opacity:0;transition:opacity .15s ease .05s}
.app.nav-open .brand-name{opacity:1}
.nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav-bottom{padding:10px 8px;border-top:1px solid var(--line)}
.nav-item{
  position:relative;display:flex;align-items:center;gap:11px;
  height:38px;padding:0 12px;border-radius:var(--radius);
  color:var(--muted);font-weight:500;white-space:nowrap;
  transition:background .12s ease,color .12s ease;
}
.nav-item:hover{background:var(--warm);color:var(--ink)}
.nav-item.active{background:var(--blue-light);color:var(--blue)}
.nav-ico{width:18px;height:18px;flex-shrink:0;display:grid;place-items:center}
.nav-label{opacity:0;transition:opacity .15s ease .04s}
.app.nav-open .nav-label{opacity:1}
/* tooltip when collapsed */
.app:not(.nav-open) .nav-item:hover::after{
  content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;
  transform:translateY(-50%);background:var(--ink);color:#fff;
  font-size:12px;font-weight:500;padding:4px 8px;border-radius:4px;white-space:nowrap;
  z-index:60;
}

/* ---------- top bar ---------- */
.topbar{
  height:56px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;gap:16px;
}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.page-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:10px}
.icon-btn{
  width:32px;height:32px;display:grid;place-items:center;border-radius:var(--radius);
  color:var(--muted);transition:background .12s ease,color .12s ease;position:relative;
}
.icon-btn:hover{background:var(--warm);color:var(--ink)}
.icon-btn.active{background:var(--blue-light);color:var(--blue)}
#notifBtn::after{
  content:"";position:absolute;top:7px;right:7px;width:6px;height:6px;
  border-radius:50%;background:var(--red);
}
.search{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;
  background:var(--warm);border:1px solid transparent;border-radius:var(--radius);
  color:var(--muted);min-width:170px;transition:border-color .12s ease,background .12s ease;
}
.search:focus-within{background:#fff;border-color:var(--blue)}
.search input{border:none;outline:none;background:transparent;width:100%;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.avatar{
  width:30px;height:30px;border-radius:50%;background:var(--blue-light);color:var(--blue);
  font-weight:700;font-size:12px;display:grid;place-items:center;
}
.avatar:hover{background:#DBEAFE}

/* ---------- view ---------- */
.view{flex:1;overflow-y:auto;padding:28px 32px;min-width:0}
.view-inner{max-width:1080px;margin:0 auto}
.page-head{margin-bottom:24px}
.page-head h1{font-size:20px;font-weight:700}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:2px}
.page-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:34px;padding:0 14px;border-radius:var(--radius);
  font-weight:600;font-size:13.5px;transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-hover)}
.btn-secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-secondary:hover{border-color:#D6D3D1;background:var(--warm)}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{background:var(--warm);color:var(--ink)}

/* ---------- metrics (overview) ---------- */
.metrics{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:28px;overflow:hidden;
}
.metric{padding:18px 22px}
.metric + .metric{border-left:1px solid var(--line)}
.metric .m-label{color:var(--muted);font-size:13px;font-weight:500}
.metric .m-value{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.01em}

/* ---------- sections & lists ---------- */
.section{margin-bottom:30px}
.section h2{font-size:15px;font-weight:700;margin-bottom:12px}
.list{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list-row{
  display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;
  transition:background .1s ease;
}
.list-row + .list-row{border-top:1px solid var(--line)}
.list-row:hover{background:var(--warm)}
.list-row.selected{background:var(--blue-light)}

/* ---------- tables ---------- */
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{
  text-align:left;font-size:12px;font-weight:600;color:var(--muted);
  text-transform:none;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--warm);
}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer;transition:background .1s ease}
tbody tr.clickable:hover{background:var(--warm)}
tbody tr.clickable.selected{background:var(--blue-light)}

/* ---------- status ---------- */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--warm);color:var(--muted)}
.status-preparing{background:var(--blue-light);color:var(--blue)}
.status-paid,.status-delivered{background:var(--green-bg);color:var(--green)}
.status-pending{background:#FBF6EC;color:var(--amber)}

/* ---------- filters ---------- */
.filters{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:-1px}
.filter{
  padding:9px 12px;font-size:13.5px;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s ease,border-color .12s ease;
}
.filter:hover{color:var(--ink)}
.filter.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.filter-count{font-size:11.5px;color:var(--muted);margin-left:4px}
.filter.active .filter-count{color:var(--blue)}

/* ---------- conversations ---------- */
.conv-layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 112px);min-height:420px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.conv-left{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.conv-left-head{padding:14px 16px 10px}
.conv-left-head h2{font-size:15px;font-weight:700;margin-bottom:10px}
.conv-search{
  display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;
  background:var(--warm);border-radius:var(--radius);color:var(--muted);
}
.conv-search input{border:none;outline:none;background:transparent;width:100%}
.conv-list{flex:1;overflow-y:auto}
.conv-item{display:flex;align-items:center;gap:11px;padding:11px 16px;cursor:pointer;border-left:2px solid transparent;transition:background .1s ease}
.conv-item + .conv-item{border-top:1px solid var(--line)}
.conv-item:hover{background:var(--warm)}
.conv-item.selected{background:var(--blue-light);border-left-color:var(--blue)}
.conv-avatar{width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--blue-light);color:var(--blue);font-weight:700;font-size:12px;display:grid;place-items:center}
.conv-meta{flex:1;min-width:0}
.conv-meta .c-name{font-weight:600;font-size:13.5px}
.conv-meta .c-msg{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-time{font-size:11.5px;color:var(--muted);flex-shrink:0}
.conv-right{display:flex;flex-direction:column;min-width:0}
.conv-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line)}
.conv-head .ch-name{font-weight:700;font-size:14.5px}
.conv-head .ch-sub{font-size:12.5px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:72%;padding:9px 13px;border-radius:10px;font-size:13.5px;position:relative}
.msg .m-time{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;text-align:right}
.msg-customer{align-self:flex-start;background:var(--warm);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg-business{align-self:flex-end;background:var(--blue-light);border-bottom-right-radius:4px}
.msg-input{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.msg-input input{
  flex:1;height:36px;border:1px solid var(--line);border-radius:var(--radius);
  padding:0 12px;outline:none;transition:border-color .12s ease;
}
.msg-input input:focus{border-color:var(--blue)}
/* ---------- order progress ---------- */
.steps{display:flex;align-items:center;list-style:none}
.step{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.step:last-child{flex:0 0 auto}
.step-dot{width:24px;height:24px;border-radius:50%;background:var(--warm);border:1.5px solid var(--line);color:var(--muted);font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.step-label{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.step-line{flex:1;height:2px;background:var(--line);margin:0 10px;min-width:14px;transition:background .2s ease}
.step.done .step-dot{background:var(--blue);border-color:var(--blue);color:#fff}
.step.done .step-label{color:var(--ink)}
.step.done ~ .step .step-line{background:var(--blue)}
.steps .step.done + .step-line{background:var(--blue)}
.step.current .step-dot{background:#fff;border-color:var(--blue);color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.step.current .step-label{color:var(--blue);font-weight:700}
.step-label .sub{display:block;font-size:11px;color:var(--muted);font-weight:400}

/* ---------- side panel ---------- */
.panel-wrap{
  position:fixed;top:0;right:0;height:100%;width:380px;max-width:94vw;background:#fff;
  border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(23,32,51,.06);
  transform:translateX(102%);transition:transform .2s ease;z-index:50;
  display:flex;flex-direction:column;
}
.panel-wrap.open{transform:translateX(0)}
.panel-wrap:focus{outline:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.panel-head h2{font-size:15px;font-weight:700}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-shrink:0}
.panel-foot .btn{flex:1}
.panel-backdrop{position:fixed;inset:0;background:rgba(23,32,51,.18);z-index:45;opacity:0;pointer-events:none;transition:opacity .18s ease}
.panel-backdrop.show{opacity:1;pointer-events:auto}

/* ---------- forms ---------- */
.field{margin-bottom:16px}
.field > label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{
  width:100%;height:36px;border:1px solid var(--line);border-radius:var(--radius);
  padding:0 12px;background:#fff;outline:none;transition:border-color .12s ease;
}
.field input:focus,.field select:focus{border-color:var(--blue)}
.field input[readonly]{background:var(--warm);color:var(--muted)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-total{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line);margin-top:4px}
.field-total .t-label{font-weight:600;font-size:14px}
.field-total .t-value{font-weight:700;font-size:16px}

/* ---------- order detail ---------- */
.od-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.od-head h1{font-size:20px;font-weight:700}
.od-sub{color:var(--muted);font-size:14px;margin-top:2px}
.od-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-top:20px}
.od-block{padding:18px 20px}
.od-block + .od-block{border-left:1px solid var(--line)}
.od-block h3{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.02em}
.od-item{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}
.od-item + .od-item{border-top:1px solid var(--line)}
.od-item .oi-name{font-weight:600}
.od-item .oi-meta{color:var(--muted);font-size:12.5px}
.od-total{display:flex;justify-content:space-between;padding-top:12px;margin-top:6px;border-top:1px solid var(--line);font-weight:700;font-size:15px}
.od-status-card{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}
.od-status-card .steps-wrap{margin:6px 0 18px}

/* ---------- detail back link ---------- */
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px;padding:4px 0}
.back-link:hover{color:var(--blue)}
.back-link svg{width:14px;height:14px}

/* ---------- customers detail ---------- */
.cd-grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.cd-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.cd-card .cd-avatar{width:44px;height:44px;border-radius:50%;background:var(--blue-light);color:var(--blue);font-weight:700;font-size:15px;display:grid;place-items:center;margin-bottom:12px}
.cd-card .cd-name{font-size:16px;font-weight:700}
.cd-card .cd-phone{color:var(--muted);font-size:13.5px;margin-top:2px}
.cd-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cd-stat .s-label{font-size:12px;color:var(--muted)}
.cd-stat .s-value{font-size:15px;font-weight:700;margin-top:2px}
.cd-section{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.cd-section > h3{font-size:13px;font-weight:600;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.02em}
.cd-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;cursor:pointer;transition:background .1s ease}
.cd-row + .cd-row{border-top:1px solid var(--line)}
.cd-row:hover{background:var(--warm)}
.cd-row .r-main{font-weight:600;font-size:13.5px}
.cd-row .r-sub{font-size:12px;color:var(--muted)}

/* ---------- products ---------- */
.prod-thumb{width:32px;height:32px;border-radius:5px;background:var(--warm);border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0;font-size:13px;font-weight:700;color:var(--muted)}
.prod-name{font-weight:600}
.prod-sku{font-size:12px;color:var(--muted)}
.stock-ok{font-weight:600}
.stock-low{color:var(--amber);font-weight:600}
.stock-out{color:var(--red);font-weight:600}
.row-actions{display:flex;gap:4px;justify-content:flex-end}

/* ---------- list row columns (overview, orders, customers) ---------- */
.list-row{flex-wrap:wrap}
.l-id{font-weight:600;width:46px;flex-shrink:0}
.l-cust{flex:1;min-width:120px;font-weight:500}
.l-total{font-weight:600;flex-shrink:0}
.l-status{flex-shrink:0}
.dim{color:var(--muted)}

/* ---------- page search (customers) ---------- */
.page-search{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;max-width:340px;
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);color:var(--muted);
  margin-bottom:16px;transition:border-color .12s ease;
}
.page-search:focus-within{border-color:var(--blue)}
.page-search input{border:none;outline:none;background:transparent;width:100%}

/* ---------- two column sections ---------- */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;align-items:start}
.two-col .section{margin-bottom:0}

/* ---------- order detail ---------- */
.order-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;align-items:start}
.order-cols .section{margin-bottom:0}
.total-row{
  display:flex;align-items:center;justify-content:space-between;padding:13px 16px;
  border-top:1px solid var(--line);font-weight:700;font-size:14.5px;
}
.oi-main{flex:1;display:flex;flex-direction:column;min-width:0}
.oi-name{font-weight:600}
.oi-size{font-size:12.5px;color:var(--muted)}

/* ---------- customer detail ---------- */
.cust-head{display:flex;align-items:center;gap:12px}
.cust-head h1{font-size:20px;font-weight:700}
.cust-head .sub{color:var(--muted);font-size:14px}
.cust-stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:24px;overflow:hidden;
}
.cust-stats > div{padding:14px 20px;display:flex;flex-direction:column}
.cust-stats > div + div{border-left:1px solid var(--line)}
.cs-v{font-size:16px;font-weight:700}
.cs-l{font-size:12.5px;color:var(--muted);margin-top:1px}

/* ---------- settings ---------- */
.settings-list .list-row{display:flex;justify-content:space-between;gap:16px}

/* ---------- misc ---------- */
.empty-inline{padding:28px 20px;text-align:center;color:var(--muted);font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
.empty{padding:48px 24px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
.e-title{font-size:15px;font-weight:700}
.e-sub{color:var(--muted);font-size:13.5px;margin:6px 0 16px}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,12px);
  background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;
  padding:10px 18px;border-radius:var(--radius);opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;z-index:80;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width: 900px){
  .view{padding:20px 16px}
  .metrics{grid-template-columns:1fr}
  .metric + .metric{border-left:none;border-top:1px solid var(--line)}
  .od-grid,.cd-grid{grid-template-columns:1fr}
  .od-block + .od-block{border-left:none;border-top:1px solid var(--line)}
  .conv-layout{grid-template-columns:1fr;height:auto}
  .conv-left{border-right:none;border-bottom:1px solid var(--line);max-height:38vh}
  .conv-right{height:calc(62vh - 30px);min-height:340px}
  .od-head{flex-direction:column}
}
@media (max-width: 640px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);box-shadow:none}

  <script>
/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function naira(n) {
  return "₦" + Number(n).toLocaleString("en-NG");
}

function initials(name) {
  return name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
}

const FLOW_STEPS = ["Confirmed", "Preparing", "Ready", "Out for delivery", "Delivered"];

function statusClass(status) {
  const map = {
    "Preparing": "status-preparing",
    "Paid": "status-paid",
    "Delivered": "status-delivered",
    "Pending": "status-pending"
  };
  return map[status] || "";
}

function stageIndex(status) {
  const map = {
    "Pending": 0,
    "Confirmed": 0,
    "Preparing": 1,
    "Ready": 2,
    "Out for delivery": 3,
    "Delivered": 4
  };
  return map[status] != null ? map[status] : 0;
}

function showToast(msg) {
  let t = $("#toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.className = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2400);
}

function pageHead(title, sub, actionHtml) {

/* ----- Conversations ----- */
function renderConversations() {
  const q = state.convQuery.toLowerCase();
  const list = CONVERSATIONS.filter((c) => !q || c.name.toLowerCase().includes(q) || c.preview.toLowerCase().includes(q));
  view.innerHTML = `
  <div class="conv-layout">
    <div class="conv-left">
      <div class="conv-left-head">
        <h2>Conversations</h2>
        <div class="conv-search">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
          <input type="search" id="convSearch" placeholder="Search" value="${esc(state.convQuery)}" aria-label="Search conversations">
        </div>
      </div>
      <div class="conv-list" id="convList">
        ${list.length ? list.map((c) => `
          <div class="conv-item ${c.id === state.convId ? "selected" : ""}" data-conv="${c.id}" role="button" tabindex="0">
            <span class="conv-avatar">${initials(c.name)}</span>
            <span class="conv-meta">
              <span class="c-name">${esc(c.name)}</span>
              <span class="c-msg">“${esc(c.preview)}”</span>
            </span>
            <span class="conv-time">${esc(c.time)}</span>
          </div>`).join("") : `<div class="empty-inline">No conversations match.</div>`}
      </div>
    </div>
    <div class="conv-right" id="convRight"></div>
  </div>`;
  renderConvThread();
  const search = $("#convSearch");
  if (search) {
    const onInput = () => {
      state.convQuery = search.value;
      renderConversations();
      const s = $("#convSearch");
      if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    };
    search.addEventListener("input", onInput);
  }
}

function renderConvThread() {
  const right = $("#convRight");
  if (!right) return;
  const c = CONVERSATIONS.find((x) => x.id === state.convId);
  if (!c) {
    right.innerHTML = `<div class="empty"><div class="e-title">No conversation selected</div><p class="e-sub">Pick a conversation to start.</p></div>`;
    return;
  }
  right.innerHTML = `
    <div class="conv-head">
      <div><div class="ch-name">${esc(c.name)}</div><div class="ch-sub">${esc(c.phone)}</div></div>
      <button class="btn btn-primary" id="createOrderBtn">Create order</button>
    </div>
    <div class="msgs" id="msgs">
      ${c.messages.map((m) => `
        <div class="msg ${m.from === "customer" ? "msg-customer" : "msg-business"}">
          ${esc(m.text)}<span class="m-time">${esc(m.time)}</span>
        </div>`).join("")}
    </div>
    <div class="msg-input">
      <input type="text" id="msgInput" placeholder="Type a message" aria-label="Type a message">
      <button class="btn btn-primary" id="sendBtn">Send</button>
    </div>`;
  const msgs = $("#msgs");
  if (msgs) msgs.scrollTop = msgs.scrollHeight;
  $("#createOrderBtn").addEventListener("click", () => openOrderPanel(c.id));
  const input = $("#msgInput");
  const send = () => {
    const text = input.value.trim();
    if (!text) return;
    c.messages.push({ from: "business", text, time: nowTime() });
    c.preview = text;
    c.time = "Just now";
    renderConvThread();
    const msgs2 = $("#msgs");
    if (msgs2) msgs2.scrollTop = msgs2.scrollHeight;
    const i2 = $("#msgInput");
    if (i2) i2.focus();
  };
  $("#sendBtn").addEventListener("click", send);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
}

function nowTime() {
  return new Date().toLocaleTimeString("en-GB", { hour: "numeric", minute: "2-digit" });
}

        <h2>Delivery progress</h2>
        <div class="list"><div style="padding:18px 20px">
          <div class="steps">
            ${FLOW_STEPS.map((s, i) => `
              <div class="step ${i < stage ? "done" : ""} ${i === stage ? "current" : ""}">
                <span class="step-dot">${i < stage ? "✓" : i + 1}</span>
                <span class="step-label">${esc(s)}</span>
              </div>`).join("")}
          </div>
        </div></div>
      </div>
    </div>
  </div>`;
  $("#updateStatusBtn").addEventListener("click", () => {
    const next = FLOW_STEPS[stage + 1];
    if (!next) { showToast("This order is already delivered."); return; }
    o.status = next;
    renderOrderDetail(o.id);
    showToast(`Status updated to ${next}.`);
  });
}

function customerRef(name) {
  const c = CUSTOMERS_TABLE.find((x) => x.name === name);
  return c ? c.id : "unknown";
}

/* ----- Customers ----- */
function renderCustomers() {
  const q = state.custQuery.toLowerCase();
  const rows = CUSTOMERS_TABLE.filter((c) => !q || c.name.toLowerCase().includes(q) || c.phone.toLowerCase().includes(q));
  view.innerHTML = `
  <div class="view-inner">
    ${pageHead("Customers", "Everyone who has ordered from you.")}
    <div class="page-search">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      <input type="search" id="custSearch" placeholder="Search customers" value="${esc(state.custQuery)}" aria-label="Search customers">
    </div>
    ${rows.length ? `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Phone</th><th>Orders</th><th>Total spent</th><th>Last order</th></tr></thead>
        <tbody>
          ${rows.map((c) => `
            <tr class="clickable" data-goto="customer/${c.id}">
              <td data-th="Name"><span class="cust-cell"><span class="conv-avatar" style="width:28px;height:28px;font-size:11px">${initials(c.name)}</span>${esc(c.name)}</span></td>
              <td class="dim" data-th="Phone">${esc(c.phone)}</td>
              <td data-th="Orders">${c.orders}</td>
              <td data-th="Total spent">${naira(c.spent)}</td>
              <td class="dim" data-th="Last order">${esc(c.last)}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>` : `<div class="empty"><div class="e-title">No customers found</div><p class="e-sub">Try a different search.</p></div>`}
  </div>`;
  const s = $("#custSearch");
  s.addEventListener("input", () => {
    state.custQuery = s.value;
    renderCustomers();
    const s2 = $("#custSearch");
    s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length);
  });
}

function renderCustomerDetail(id) {
  const c = CUSTOMERS_TABLE.find((x) => String(x.id) === String(id));
  if (!c) {
    view.innerHTML = `<div class="empty"><div class="e-title">Customer not found</div><a class="btn btn-secondary" href="#/customers">Back to customers</a></div>`;
    return;
  }
  const orders = ORDERS.filter((o) => o.customer === c.name);
  view.innerHTML = `
  <div class="view-inner">
    <a class="back-link" href="#/customers">Back to customers</a>
    <div class="page-head">
      <div class="page-head-row">
        <div class="cust-head">
          <span class="conv-avatar" style="width:40px;height:40px;font-size:14px">${initials(c.name)}</span>
          <div><h1>${esc(c.name)}</h1><div class="sub">${esc(c.phone)}</div></div>
        </div>
      </div>
    </div>
    <div class="cust-stats">
      <div><span class="cs-v">${c.orders}</span><span class="cs-l">Orders</span></div>
      <div><span class="cs-v">${naira(c.spent)}</span><span class="cs-l">Total spent</span></div>
      <div><span class="cs-v">${esc(c.last)}</span><span class="cs-l">Last order</span></div>
    </div>
    <div class="two-col">
      <div class="section">
        <h2>Order history</h2>
        ${orders.length ? `<div class="list">
          ${orders.map((o) => `
            <div class="list-row" data-goto="order/${o.id}">
              <span class="l-id">#${o.id}</span>
              <span class="dim">${o.items.map((i) => i.name).join(", ")}</span>
              <span class="l-total">${naira(o.total)}</span>
              <span class="l-status"><span class="status ${statusClass(o.status)}">${esc(o.status)}</span></span>
            </div>`).join("")}
        </div>` : `<div class="empty-inline">No orders from this customer yet.</div>`}
      </div>
      <div class="section">
        <h2>Conversation</h2>
        ${c.convId ? `<div class="list">
          <div class="list-row" data-goto="conversations/${c.convId}">
            <span class="conv-avatar" style="width:28px;height:28px;font-size:11px">💬</span>
            <span class="conv-meta"><span class="c-name">WhatsApp chat</span><span class="c-msg">"${esc(c.name)}" · open the conversation</span></span>
            <span class="conv-time">→</span>
          </div>
        </div>` : `<div class="empty-inline">No conversation yet.</div>`}
      </div>
    </div>
  </div>`;
}

/* ----- Products ----- */
function renderProducts() {
  view.innerHTML = `
  <div class="view-inner">
    ${pageHead("Products", "Manage what you sell.", `<button class="btn btn-primary" id="addProductBtn">+ Add product</button>`)}
    ${PRODUCTS.length ? `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
        <tbody>
          ${PRODUCTS.map((p) => `
            <tr>
              <td data-th="Product"><span class="prod-cell"><span class="prod-thumb" aria-hidden="true">${initials(p.name)}</span><span><span class="prod-name">${esc(p.name)}</span><span class="prod-note">${esc(p.sizeNote)}</span></span></span></td>
              <td data-th="Price">${naira(p.price)}</td>
              <td data-th="Stock">${p.stock === 0 ? `<span class="stock-out">Out of stock</span>` : p.stock}</td>
              <td data-th="Actions"><button class="btn btn-ghost" data-edit-product="${p.id}">Edit</button></td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>` : `
    <div class="empty">
      <div class="e-title">No products yet</div>
      <p class="e-sub">Add your first product.</p>
      <button class="btn btn-primary" id="addProductEmpty">Add product</button>
    </div>`}
  </div>`;
  const wire = (id) => { const b = $(id); if (b) b.addEventListener("click", () => showToast("Product editor coming soon.")); };
  wire("#addProductBtn"); wire("#addProductEmpty");
  $$("#view [data-edit-product]").forEach((b) => b.addEventListener("click", () => showToast("Product editor coming soon.")));
}

/* ----- Settings ----- */
function renderSettings() {
  view.innerHTML = `
  <div class="view-inner" style="max-width:640px">
    ${pageHead("Settings", "How Flowdesk works for your business.")}
    <div class="list settings-list">
      <div class="list-row" style="cursor:default"><span class="cs-l" style="min-width:120px">Business name</span><span class="l-total">${esc(BUSINESS.name)}</span></div>
      <div class="list-row" style="cursor:default"><span class="cs-l" style="min-width:120px">Owner</span><span class="l-total">${esc(BUSINESS.owner)}</span></div>
      <div class="list-row" style="cursor:default"><span class="cs-l" style="min-width:120px">Currency</span><span class="l-total">Naira (₦)</span></div>
      <div class="list-row" style="cursor:default"><span class="cs-l" style="min-width:120px">WhatsApp</span><span class="l-total">Connected</span></div>
    </div>
  </div>`;
}
/* ---------- wiring ---------- */
/* ---------- create order panel ---------- */
const panel = $("#panel");
let panelBackdrop = null;

function openOrderPanel(convId, blank) {
  const c = CONVERSATIONS.find((x) => x.id === convId) || null;
  const options = PRODUCTS.map((p, i) => `<option value="${i}" ${p.name === "Black Dress" ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  panel.innerHTML = `
    <div class="panel-head">
      <h2>Create order</h2>
      <button class="icon-btn" id="panelClose" aria-label="Close panel">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <div class="field"><label for="po-customer">Customer</label><input id="po-customer" value="${c ? esc(c.name) : "New customer"}" ${c ? "readonly" : ""}></div>
      <div class="field"><label for="po-product">Product</label><select id="po-product">${options}</select></div>
      <div class="field-row">
        <div class="field"><label for="po-size">Size</label><input id="po-size" value="12"></div>
        <div class="field"><label for="po-qty">Quantity</label><input id="po-qty" type="number" min="1" value="1"></div>
      </div>
      <div class="field"><label for="po-price">Price</label><input id="po-price" readonly></div>
      <div class="field"><label for="po-delivery">Delivery</label><input id="po-delivery" value="Tomorrow"></div>
      <div class="field-total"><span class="t-label">Total</span><span class="t-value" id="po-total"></span></div>
    </div>
    <div class="panel-foot">
      <button class="btn btn-secondary" id="panelCancel">Cancel</button>
      <button class="btn btn-primary" id="panelCreate">Create order</button>
    </div>`;
  if (!panelBackdrop) {
    panelBackdrop = document.createElement("div");
    panelBackdrop.className = "panel-backdrop";
    panelBackdrop.addEventListener("click", closeOrderPanel);
    document.body.appendChild(panelBackdrop);
  }
  const priceEl = $("#po-price");
  const totalEl = $("#po-total");
  const recalc = () => {
    const p = PRODUCTS[+$("#po-product").value];
    const qty = Math.max(1, +$("#po-qty").value || 1);
    priceEl.value = naira(p.price);
    totalEl.textContent = naira(p.price * qty);
  };
  $("#po-product").addEventListener("change", recalc);
  $("#po-qty").addEventListener("input", recalc);
  recalc();
  $("#panelClose").addEventListener("click", closeOrderPanel);
  $("#panelCancel").addEventListener("click", closeOrderPanel);
  $("#panelCreate").addEventListener("click", () => {
    const p = PRODUCTS[+$("#po-product").value];
    const qty = Math.max(1, +$("#po-qty").value || 1);
    const id = String(nextOrderNum++);
    const size = $("#po-size").value.trim() || "—";
    const customer = c ? c.name : $("#po-customer").value.trim() || "New customer";
    ORDERS.unshift({
      id, customer,
      phone: c ? c.phone : "+234 800 000 0000",
      convId: c ? c.id : null,
      items: [{ name: p.name, size, qty, price: p.price }],
      total: p.price * qty,
      payment: "Pending",
      status: "Confirmed",
      date: "Today",
      placedAt: nowTime()
    });
    closeOrderPanel();
    location.hash = `#/order/${id}`;
    showToast(`Order #${id} created.`);
  });
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  panelBackdrop.classList.add("show");
}

function closeOrderPanel() {
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
  if (panelBackdrop) panelBackdrop.classList.remove("show");
}

/* ---------- router ---------- */
const NAV_TITLES = { overview: "Overview", orders: "Orders", conversations: "Conversations", customers: "Customers", products: "Products", settings: "Settings" };

function parseHash() {
  const m = (location.hash || "#/overview").replace(/^#\/?/, "").split("/").filter(Boolean);
  return { section: m[0] || "overview", param: m[1] };
}

function renderRoute() {
  const { section, param } = parseHash();
  closeOrderPanel();
  $("#globalSearch").value = "";
  state.convQuery = "";
  state.custQuery = "";
  $$(".nav-item").forEach((a) => a.classList.toggle("active", a.dataset.route === section));
  const title = NAV_TITLES[section] || (section === "order" ? "Orders" : section === "customer" ? "Customers" : "Overview");
  $("#pageTitle").textContent = title;
  if (section === "conversations") { if (param) state.convId = param; renderConversations(); }
  else if (section === "order") renderOrderDetail(param);
  else if (section === "customer") renderCustomerDetail(param);
  else if (section === "orders") renderOrders();
  else if (section === "customers") renderCustomers();
  else if (section === "products") renderProducts();
  else if (section === "settings") renderSettings();
  else renderOverview();
  view.focus({ preventScroll: true });
}

/* ---------- global wiring ---------- */
// Navigation (delegated: rows and links with data-goto)
view.addEventListener("click", (e) => {
  const goto = e.target.closest("[data-goto]");
  if (goto) { location.hash = `#/${goto.dataset.goto}`; return; }
  const conv = e.target.closest("[data-conv]");
  if (conv) { state.convId = conv.dataset.conv; renderConversations(); }
});

// Sidebar: menu button toggles, hover expands temporarily
const app = $("#app");
let navLocked = false;
$("#menuBtn").addEventListener("click", () => {
  navLocked = !navLocked;
  app.classList.toggle("nav-open", navLocked);
  $("#menuBtn").setAttribute("aria-expanded", String(navLocked));
});
$("#sidebar").addEventListener("mouseenter", () => { if (!navLocked) app.classList.add("nav-open"); });
$("#sidebar").addEventListener("mouseleave", () => { if (!navLocked) app.classList.remove("nav-open"); });

// Global search: filters the list shown on the current page
$("#globalSearch").addEventListener("input", (e) => {
  const { section } = parseHash();
  const v = e.target.value;
  if (section === "conversations") { state.convQuery = v; renderConversations(); }
  else if (section === "customers") { state.custQuery = v; renderCustomers(); }
});

// Top bar niceties
$("#notifBtn").addEventListener("click", () => showToast("You're all caught up."));
$("#profileBtn").addEventListener("click", () => showToast(`Signed in as ${BUSINESS.owner}.`));

// Escape closes the order panel
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && panel.classList.contains("open")) closeOrderPanel(); });

window.addEventListener("hashchange", renderRoute);
if (!location.hash) location.hash = "#/overview";
renderRoute();
  </script>
